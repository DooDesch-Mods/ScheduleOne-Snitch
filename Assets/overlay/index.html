<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snitch</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root" class="root">
  <div id="desk" class="desk">
    <div id="card" class="win standings compact" data-win="standings">
      <div id="head" class="wbar head">
        <div class="brand">Snitch</div>
        <div id="sum" class="sum">Waiting for samples</div>
        <div class="grow"></div>
        <div id="winbar" class="seg">
          <button class="segbtn" data-w="10">10 s</button>
          <button class="segbtn" data-w="30">30 s</button>
          <button class="segbtn" data-w="120">2 min</button>
        </div>
        <button id="toggle" class="btn ghost" title="Expand">Expand</button>
        <button id="closecard" class="wclose" title="Compact"><div class="xa"></div><div class="xb"></div></button>
      </div>
      <div id="wbody" class="wbody">
        <div id="ctl" class="ctl">
          <button id="run" class="btn navy">Start</button>
          <button id="reset" class="btn">Reset</button>
          <button id="dash" class="btn">Dashboard</button>
          <button id="phone" class="btn">Phone</button>
          <div class="grow"></div>
          <div id="hint" class="hint"></div>
        </div>
        <div id="note" class="note"></div>
        <div id="strip" class="strip">
          <div class="striplab">Windows</div>
          <div id="chips" class="chips"></div>
          <button id="resetlayout" class="btn chip">Reset layout</button>
        </div>
        <div id="pair" class="pair">
          <img id="qr" class="qr" src="s1://qr">
          <div class="pairtxt">
            <div class="pairt">Phone remote</div>
            <div id="pairu" class="pairu"></div>
          </div>
        </div>
        <div id="rows" class="rows"></div>
        <div id="morerows" class="morerows"></div>
        <div id="chint" class="chint"></div>
        <div class="foot"></div>
      </div>
      <div id="grip" class="grip"><div class="gl"></div></div>
    </div>
    <div id="ghost" class="ghost"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
